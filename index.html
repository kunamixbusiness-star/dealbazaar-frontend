<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>DealBazaar - Har Kaam Ka Deal</title>
<style>
body{font-family: Arial; background:#f4f4f4; margin:0; padding:20px}
h1{text-align:center; color:#ff6600}
.deal{background:white; padding:15px; margin:10px; border-radius:8px; box-shadow:0 2px 5px #ccc}
button{background:#25D366; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; width:100%}
</style>
</head>
<body>
<h1>🤝 DealBazaar - India ka Sabse Bada Deal Platform</h1>
<div id="deals"></div>
<script>
const deals = [
  {id:1, title:"Mixer Grinder - 60% Off", price:1999},
  {id:2, title:"MacBook Pro M3", price:180000}
];
let html = "";
deals.forEach(deal => {
  let commission = Math.round(deal.price * 0.20);
  html += `
    <div class="deal">
      <h3>${deal.title}</h3>
      <p><b>Price:</b> ₹${deal.price}</p>
      <p style="color:red"><b>Deal karne ke liye pehle ₹${commission} commission do</b></p>
      <button onclick="payCommission(${commission}, '${deal.title}')">Deal Pakka Karo ₹${commission}</button>
    </div>
  `
});
document.getElementById('deals').innerHTML = html;
function payCommission(amount, title) {
  let upiLink = `upi://pay?pa=8851589873-3@ybl&pn=DealBazaar&am=${amount}&cu=INR&tn=Commission for ${title}`;
  window.location.href = upiLink;
  alert("Payment karne ke baad screenshot bhejo. Fir hum dono party ko connect kar denge.");
}
</script>
</body>
</html>
