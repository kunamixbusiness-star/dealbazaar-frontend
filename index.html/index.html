<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DealBazaar - Customer</title>
<style>
body { font-family: Arial; background: #f5f5f5; margin: 0; padding: 20px; }
h1 { text-align: center; color: #ff6b35; }
.deal { background: white; padding: 15px; margin: 15px auto; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; }
.buy-btn { background: #ff6b35; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; }
#paymentModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
.modal-content { background: white; margin: 15% auto; padding: 20px; width: 80%; max-width: 400px; border-radius: 10px; text-align: center; }
</style>
</head>
<body>
<h1>🔥 DealBazaar Offers</h1>

<div class="deal">
  <h3>Deal 1: ₹99 me ₹200 ka product</h3>
  <button class="buy-btn" onclick="showPayment('Deal 1', 99)">Buy Now ₹99</button>
</div>

<div class="deal">
  <h3>Deal 2: ₹149 me ₹300 ka product</h3>
  <button class="buy-btn" onclick="showPayment('Deal 2', 149)">Buy Now ₹149</button>
</div>

<div id="paymentModal">
  <div class="modal-content">
    <h2>Payment</h2>
    <p id="dealInfo"></p>
    <input type="tel" id="phone" placeholder="Enter Phone Number" style="padding: 10px; width: 80%; margin: 10px 0;">
    <br>
    <button onclick="payNow()" style="background: #25D366; color: white; padding: 10px 20px; border: none; border-radius: 5px;">Pay with UPI</button>
    <button onclick="closeModal()" style="background: gray; color: white; padding: 10px 20px; border: none; border-radius: 5px;">Cancel</button>
  </div>
</div>

<script>
let currentDeal = "";
let currentAmount = 0;

function showPayment(deal, amount) {
  currentDeal = deal;
  currentAmount = amount;
  document.getElementById('dealInfo').innerText = deal + " - ₹" + amount;
  document.getElementById('paymentModal').style.display = 'block';
}

function closeModal() {
  document.getElementById('paymentModal').style.display = 'none';
}

function payNow() {
  let phone = document.getElementById('phone').value;
  if(phone.length < 10) { alert("Enter valid number"); return; }
  let upiLink = `upi://pay?pa=8851589873-3@ybl&pn=DealBazaar&am=${currentAmount}&cu=INR&tn=${currentDeal}`;
  window.location.href = upiLink;
  alert("UPI App khul jayega. Payment karne ke baad screenshot bhej dena.");
  closeModal();
}
</script>
</body>
</html>
